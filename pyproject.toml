[project]
name = "analytics-agent-playground"
version = "0.1.0"
description = "A synthetic e-commerce business used to test data platform components: an LLM analytics agent's correctness and data-limitation awareness, and a CDC pipeline's correctness and lag"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "faker>=24.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "anthropic>=0.40.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "psycopg[binary]>=3.1.0",
    "confluent-kafka>=2.3.0",
    "boto3>=1.34.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "dbt-metricflow[dbt-duckdb]>=0.15.0",
]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "benchmark", "benchmark.*", "generator", "generator.*", "grader", "grader.*"]
