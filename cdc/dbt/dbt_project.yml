name: cdc_raw
version: "1.0.0"
config-version: 2

profile: cdc_raw

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

models:
  cdc_raw:
    +materialized: view
    staging:
      +schema: staging
    marts:
      +schema: marts
      # Marts materialize as real tables, refreshed on `dbt run` -- not
      # views. Staging stays views (each `dbt run` re-reads the bucket
      # fresh, per ADR-7), but an API serving a frontend can't have every
      # request trigger a full S3 rescan through several joined views.
      # `dbt run` is the batch refresh step; querying cdc_raw.duckdb after
      # that is a plain, fast table read.
      +materialized: table
