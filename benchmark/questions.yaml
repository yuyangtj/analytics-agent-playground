- id: i01
  question: What was total revenue by customer acquisition channel?
  category: issue_affected
  expected_answer:
  - acquisition_channel: paid_search
    revenue: 1819285.52
  - acquisition_channel: direct
    revenue: 1704861.96
  - acquisition_channel: referral
    revenue: 1680760.2
  - acquisition_channel: email
    revenue: 1652928.35
  - acquisition_channel: organic_search
    revenue: 1576335.99
  - acquisition_channel: social
    revenue: 1515233.29
  tolerance: null
  known_limitations:
  - missing_attribution
  requires_flag: true
