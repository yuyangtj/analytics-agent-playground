    to an unknown/null channel rather than silently omitting or misattributing it.
- id: i02
  question: What was total marketing spend by channel for the full year 2024?
  category: issue_affected
  expected_answer:
  - channel: paid_search
    spend_2024: 299296.91
  - channel: social
    spend_2024: 180497.98
  - channel: email
    spend_2024: 36743.94
  - channel: referral
    spend_2024: 18211.82
  tolerance: null
  known_limitations:
  - truncated_marketing_history
  requires_flag: true
  scoring_notes: marketing_spend in the served DB only starts 2025-05-05, so 2024 data is entirely absent.
    A correct agent must say this cannot be answered (or can only be answered from May 2025 onward) rather
    than reporting $0 or an implicitly wrong partial figure as if it were the full year.
- id: i03
  question: What was total revenue in the last 14 days of the dataset (2025-12-18 through 2025-12-31)?
  category: issue_affected
  expected_answer: 189753.96
  tolerance: null
  known_limitations:
  - late_arriving_orders
  requires_flag: true
  scoring_notes: ~70% of orders in this window were removed from the served DB to simulate pipeline lag.
    The naive query will look artificially low. Agent should flag that recent-period figures may be incomplete
    rather than presenting the low number at face value.
- id: i04
  question: How many total orders were placed, and what is total revenue across all completed orders?
  category: issue_affected
  expected_answer:
    total_orders: 15000
    completed_revenue: 9949405.31
  tolerance: 0.02
  known_limitations:
  - duplicate_orders
  requires_flag: true
  scoring_notes: 314 orders are duplicated under new order_ids with identical contents in the served DB.
    A naive COUNT/SUM will be inflated by ~2%. Agent should ideally notice and dedupe on (customer_id,
    order_date, contents), or at least flag the possibility of duplicate records.
- id: i05
  question: How many products are in the 'Electronics' category?
  category: issue_affected
  expected_answer: 115
  tolerance: 0.0
  known_limitations:
  - category_schema_drift
  requires_flag: true
  scoring_notes: Electronics products launched after 2024-12-31 are relabeled 'Electronics & Gadgets'
    in the served DB. A naive `WHERE category = 'Electronics'` filter undercounts. Agent should notice
    the second label and flag/combine it.
- id: i06
  question: What is the average order_items unit_price for EU-region customers versus all other regions?
  category: issue_affected
  expected_answer:
  - is_eu: false
    avg_unit_price: 327.65
  - is_eu: true
    avg_unit_price: 330.74
  tolerance: null
  known_limitations:
  - currency_ambiguity
  requires_flag: true
  scoring_notes: unit_price for all EU-customer order_items is silently scaled by 0.91 in the served DB,
    with no currency column to indicate this. Agent should notice the EU price gap looks larger/odder
    than category mix would explain and flag possible currency/unit inconsistency, even though it cannot
    fully diagnose the cause from the data alone.
- id: i07
  question: What was the conversion rate (completed orders per session) in the last 90 days of the dataset
    (2025-10-02 through 2025-12-31)?
  category: issue_affected
  expected_answer: 0.333
  tolerance: null
  known_limitations:
  - session_sampling
  requires_flag: true
  scoring_notes: sessions in this window are downsampled to ~20% of true volume in the served DB (undocumented).
    A naive conversion-rate calc will look ~5x too high. Agent should flag that session volume in this
    window looks suspiciously low relative to earlier periods.
- id: i08
  question: What is total revenue by product category, joining order_items to products?
  category: issue_affected
  expected_answer:
  - category: Electronics
    revenue: 2418261.69
  - category: Beauty
    revenue: 2051671.8
  - category: Apparel
    revenue: 1928971.31
  - category: Outdoors
    revenue: 1868467.08
  - category: Home
    revenue: 1682033.43
  tolerance: null
  known_limitations:
  - orphaned_references
  requires_flag: true
  scoring_notes: ~1% of order_items in the served DB reference a non-existent product_id. A plain INNER
    JOIN silently drops these rows from the total. Agent should ideally check for unmatched rows (e.g.
    via LEFT JOIN + NULL check) or at least flag that an inner join may be silently excluding data.
- id: i09
  question: What was the on-hand inventory quantity for warehouse WH-EU as of August 15, 2024, summed
    across all products?
  category: issue_affected
  expected_answer: 28488
  tolerance: null
  known_limitations:
  - incomplete_inventory_snapshots
  requires_flag: true
  scoring_notes: WH-EU has no inventory snapshots at all between 2024-06-29 and 2024-10-27 in the served
    DB (simulated feed outage), so 2024-08-15 falls inside a total gap. Agent should say no snapshot exists
    for that date/warehouse rather than silently substituting a distant snapshot as current.
- id: i10
  question: What was total revenue for December 2025?
  category: issue_affected
